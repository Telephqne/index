<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELEFAUCI</title>
    <style>
        body {
            background-color: black;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            position: relative;
            height: 100vh;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 2s ease-in-out forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .logo {
            width: 150px;
            margin: 20px auto;
            display: block;
            animation: fadeInLogo 1.5s ease-in-out forwards;
        }

        .avatar {
            width: 200px;
            height: 200px;
            position: absolute;
            left: 50%;
            top: 40%;
            transform: translate(-50%, -50%);
            animation: shake 0.1s infinite, fadeInAvatar 2s ease-in-out forwards;
        }

        @keyframes fadeInLogo {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes fadeInAvatar {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes shake {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-48%, -52%) rotate(2deg); }
            50% { transform: translate(-50%, -50%) rotate(0deg); }
            75% { transform: translate(-52%, -48%) rotate(-2deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }

        .scroll-text {
            font-size: 3em;
            font-weight: bold;
            color: #00FF00;
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            position: absolute;
            top: 70%;
            left: 0;
            animation: scroll 10s linear infinite, fadeInText 2.5s ease-in-out forwards;
            transform: skewX(20deg);
        }

        @keyframes scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        @keyframes fadeInText {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .nav {
            position: absolute;
            top: 10%;
            left: 10px;
            font-size: 1.5em;
            text-align: left;
            animation: fadeInNav 3s ease-in-out forwards;
        }

        .nav a {
            color: #00FF00;
            text-decoration: none;
            display: block;
            margin: 20px 0;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        @keyframes fadeInNav {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <img src="logo.png" alt="the best website around!" class="logo">
    <div class="nav">
        <a href="https://x.com/telefauci" target="_blank">Twitter</a>
        <a href="/Comics" target="_blank">Comics</a>
    </div>
    <img src="avatar.png" alt="Twitter Profile Picture" class="avatar">
    <div class="scroll-text">WELCOME TO MY WEBSITE!!! MAKE SURE TO FOLLOW ME ON TWITTER AND OTHER PLATFORMS</div>
</body>
</html>
